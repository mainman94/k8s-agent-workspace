# Opt-in agent setup: ponytail (a plugin that keeps changes and answers small)
# plus standing instructions that steer the agent to the fast search tools in
# the image. The chart defaults stay neutral.
agent:
  instructions: |
    # Search tools
    Prefer fast CLI tools over slow defaults: `rg` instead of `grep`, `fd`
    instead of `find`, `bat` instead of `cat` for viewing, `eza` instead of
    `ls`, `sd` instead of `sed`, `jq` for JSON, `yq` for YAML, `ast-grep` for
    structural code search/rewrite, `difft` for structural diffs (`delta` for
    readable git diffs), `tokei` for code statistics, `hyperfine` for benchmarks,
    `shellcheck` for shell scripts.

claude:
  managedSettings:
    extraKnownMarketplaces:
      ponytail:
        source: {source: github, repo: DietrichGebert/ponytail}
    enabledPlugins:
      ponytail@ponytail: true
