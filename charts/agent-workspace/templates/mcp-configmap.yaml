{{- if .Values.mcp.servers }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-workspace.fullname" . }}-mcp
  labels:
    {{- include "agent-workspace.labels" . | nindent 4 }}
data:
  mcp.json: |
    {{- dict "mcpServers" .Values.mcp.servers | toPrettyJson | nindent 4 }}
{{- end }}
