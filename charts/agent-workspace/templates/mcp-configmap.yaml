{{- if or .Values.mcp.servers .Values.agent.instructions }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-workspace.fullname" . }}-mcp
  labels:
    {{- include "agent-workspace.labels" . | nindent 4 }}
data:
  {{- if .Values.mcp.servers }}
  mcp.json: |
    {{- dict "mcpServers" .Values.mcp.servers | toPrettyJson | nindent 4 }}
  {{- end }}
  {{- if .Values.agent.instructions }}
  instructions.md: |
    {{- .Values.agent.instructions | nindent 4 }}
  {{- end }}
{{- end }}
