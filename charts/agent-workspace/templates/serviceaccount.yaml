apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-workspace.fullname" . }}
  labels:
    {{- include "agent-workspace.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ include "agent-workspace.mountToken" . }}
