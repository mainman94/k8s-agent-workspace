{{- if .Values.claude.managedSettings }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-workspace.fullname" . }}-claude
  labels:
    {{- include "agent-workspace.labels" . | nindent 4 }}
data:
  managed-settings.json: |
    {{- .Values.claude.managedSettings | toPrettyJson | nindent 4 }}
{{- end }}
